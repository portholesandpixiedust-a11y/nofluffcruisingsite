name: Cruise news

on:
  schedule:
    - cron: '0 11,23 * * *'
  workflow_dispatch:
    inputs:
      max_posts:
        description: 'Maximum posts to write this run'
        required: false
        default: '3'

permissions:
  contents: write

concurrency:
  group: cruise-news
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Research and write the news
        id: bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-sonnet-5' }}
          MAX_POSTS: ${{ github.event.inputs.max_posts || '3' }}
        run: node scripts/news-bot.mjs

      - name: Find credited images
        id: img
        run: node scripts/news-images.mjs
        continue-on-error: true

      - name: Verify the site still builds
        if: steps.bot.outputs.written != '0' || steps.img.outputs.images != '0'
        run: npm run build

      - name: Commit and publish
        if: steps.bot.outputs.written != '0' || steps.img.outputs.images != '0'
        run: |
          git config user.name  "No Fluff Cruising bot"
          git config user.email "noreply@nofluffcruising.com"
          git add src/content/news public/news
          if git diff --staged --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Cruise news: ${{ steps.bot.outputs.written }} story(ies), ${{ steps.img.outputs.images }} image(s)"
          git push

      - name: Quiet cycle
        if: steps.bot.outputs.written == '0' && steps.img.outputs.images == '0'
        run: echo "No story cleared the sourcing bar this cycle. Nothing published."
