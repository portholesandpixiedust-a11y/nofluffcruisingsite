# Retired in favor of Grok Bot news pull requests.
#
# Weekday industry news is produced by Grok Bot (research + PRs), or by a
# manual pull request. This Action used to call scripts/news-bot.mjs with
# the Anthropic API on a weekday schedule. Those runs failed on credit
# errors. Do not restore `schedule` or `workflow_dispatch`. This workflow
# must not be used. scripts/news-bot.mjs is unused by CI and is left in
# the repo only so old guardrail tests still have their module.
name: Industry news (retired)

# No schedule and no manual dispatch. workflow_call is never invoked;
# if something does call this file, the job stops before any news script.
on:
  workflow_call:

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Retired — do not use
        run: |
          echo "Industry news is retired. Weekday news is Grok Bot research and pull requests, or a manual PR."
          echo "This workflow must not be used."
          exit 1
